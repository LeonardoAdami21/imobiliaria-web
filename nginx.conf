server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # As rotas (/imoveis, /locacoes/...) existem só no navegador:
  # qualquer caminho que não seja um arquivo devolve o index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Arquivos com hash no nome nunca mudam; podem ficar em cache por um ano.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
